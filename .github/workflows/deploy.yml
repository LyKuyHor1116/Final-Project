name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Project
        shell: powershell
        run: |
          cd D:\Final-Project

          git pull origin main

          docker compose up -d --build

          docker image prune -f