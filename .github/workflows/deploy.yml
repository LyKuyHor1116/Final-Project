name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Application
        shell: powershell
        run: |
          cd D:\Final-Project

          git pull origin main

          docker compose down

          docker compose build --no-cache

          docker compose up -d

          docker image prune -f

